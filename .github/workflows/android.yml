name: Build GC-Tune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Create keystore at exact path
      run: |
        mkdir -p "$GITHUB_WORKSPACE/../poc_gcrce"
        keytool -genkeypair -v \
          -keystore "$GITHUB_WORKSPACE/../poc_gcrce/poc.keystore" \
          -alias gd \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
        echo "Keystore created:"
        ls -la "$GITHUB_WORKSPACE/../poc_gcrce/"

    - name: Build APK
      run: gradle assembleDebug --no-daemon -x validateSigningDebug -x validateSigningRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gctune-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
