name: Build GC-Tune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Install Android SDK 35
      run: |
        echo "y" | sdkmanager "platforms;android-35" "build-tools;34.0.0"

    - name: Create keystore at exact path
      run: |
        mkdir -p /home/runner/work/GC-Tune/GC-Tune/poc_grce
        keytool -genkeypair -v \
          -keystore /home/runner/work/GC-Tune/GC-Tune/poc_grce/poc.keystore \
          -alias gd \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
        echo "Keystore created:"
        ls -la /home/runner/work/GC-Tune/GC-Tune/poc_grce/

    - name: Build APK
      run: gradle assembleDebug --no-daemon -x validateSigningDebug -x validateSigningRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gctune-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
