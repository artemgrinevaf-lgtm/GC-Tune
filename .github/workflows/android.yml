name: Build GC-Tune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Create keystores in ALL possible locations
      run: |
        echo "Creating keystores in all possible paths..."
        
        # Path 1: /home/runner/work/GC-Tune/GC-Tune/poc_pcc.keystore
        mkdir -p /home/runner/work/GC-Tune/GC-Tune
        keytool -genkeypair -v -keystore /home/runner/work/GC-Tune/GC-Tune/poc_pcc.keystore -alias gd -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
        
        # Path 2: /home/runner/work/GC-Tune/poc_grce/poc.keystore
        mkdir -p /home/runner/work/GC-Tune/poc_grce
        keytool -genkeypair -v -keystore /home/runner/work/GC-Tune/poc_grce/poc.keystore -alias gd -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
        
        # Path 3: /home/runner/work/GC-Tune/GC-Tune/poc_grce/poc.keystore
        mkdir -p /home/runner/work/GC-Tune/GC-Tune/poc_grce
        keytool -genkeypair -v -keystore /home/runner/work/GC-Tune/GC-Tune/poc_grce/poc.keystore -alias gd -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
        
        echo "All keystores created!"
        find /home/runner/work/GC-Tune -name "*.keystore" -type f

    - name: Build APK
      run: gradle assembleDebug --no-daemon -x validateSigningDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gctune-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
