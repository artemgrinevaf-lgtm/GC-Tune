name: Build GC-Tune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'
    
    - name: Create fake keystore
      run: |
        mkdir -p /home/runner/work/GC-Tune/poc_grce
        keytool -genkey -v -keystore /home/runner/work/GC-Tune/poc_grce/poc.keystore -alias gd -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=GC-Tune, OU=GC-Tune, O=GC-Tune, L=Unknown, ST=Unknown, C=US"
    
    - name: Build APK
      run: gradle assembleDebug --no-daemon -x validateSigningDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gctune-apk
        path: app/build/outputs/apk/debug/app-debug.apk
